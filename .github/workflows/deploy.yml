name: Deploy CV site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Which site directory gets deployed. Change this one value to switch
# between site-c, site-professional and site-bold.
env:
  SITE_DIR: site-d

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SITE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.SITE_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The custom domain lives in <site>/public/CNAME so it lands in dist/.
      # Pages serves the uploaded artifact, not the branch, so a CNAME at the
      # repo root would be ignored and avrgk.com would break.
      - name: Verify CNAME survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing, custom domain would break"; exit 1; }
          echo "CNAME -> $(cat dist/CNAME)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
